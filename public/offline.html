<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>뷰티그라운드</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fff; color: #1a1a1a; font: 15px/1.6 -apple-system, system-ui, "Apple SD Gothic Neo", sans-serif; padding: 24px; box-sizing: border-box; }
  .box { max-width: 320px; text-align: center; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: #555; }
  button { min-height: 44px; padding: 0 22px; border: 0; border-radius: 999px; background: #1a1a1a; color: #fff; font: 600 15px/1 inherit; }
</style>
</head>
<body>
  <div class="box">
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>Wi-Fi 또는 데이터 연결을 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.href='https://beautyground.co.kr/'">다시 시도</button>
  </div>
</body>
</html>
