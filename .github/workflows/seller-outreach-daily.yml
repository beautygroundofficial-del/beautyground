# 라이브 셀러 첫 컨택 DM 자동화 — 2026-10-01
#
# 매일 09:20(KST)에 자동 실행.
# 1) 유튜브 API로 신규 셀러 후보 발굴(구독자 4천~2만·뷰티 키워드·Gemini로 "여러 브랜드
#    소개하는 셀러" vs "자사 브랜드 채널" 판별) → 큐에 보충(중복 제외)
# 2) 오늘자 최대 10명 처리 — 이메일 채널은 실제 발송, 카톡/인스타 채널은 대표님께
#    "오늘 보낼 사람 + 붙여넣을 문구" 다이제스트 메일만 발송(앱에서 직접 발송해야 함)
#
# Secrets 필요: GMAIL_APP_PASSWORD(등록됨), YOUTUBE_DATA_API_KEY(등록됨), GEMINI_API_KEY(등록됨)

name: 라이브 셀러 DM 자동화

on:
  schedule:
    - cron: "20 0 * * *"   # 매일 00:20 UTC = 09:20 KST
  workflow_dispatch: {}

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm install nodemailer --no-save

      - name: 신규 셀러 후보 발굴(중복 제외, 하루 최대 10명 보충)
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/seller_discover_daily.mjs

      - name: 오늘의 DM 처리(최대 10명)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node scripts/seller_outreach_daily.mjs

      - name: 큐·seen 상태 커밋(변경 있을 때만)
        run: |
          git config user.name "beautyground-outreach-bot"
          git config user.email "beautyground.official@gmail.com"
          git add scripts/seller_outreach_queue.json scripts/seller_outreach_seen_channels.json
          git diff --cached --quiet || git commit -m "chore(outreach): 라이브 셀러 DM 발굴·발송 기록 — $(date +%Y-%m-%d)"
          git push origin HEAD:${{ github.ref_name }}
