# 라이브 셀러 첫 컨택 DM 자동화 — 2026-10-01
#
# 매일 09:20(KST)에 자동 실행. 오늘자 최대 10명 처리 — 이메일 채널은 실제 발송,
# 카톡/인스타 채널은 대표님께 "오늘 보낼 사람 + 붙여넣을 문구" 다이제스트 메일만
# 발송(앱에서 직접 발송해야 함).
#
# ⚠️ 유튜브 자동발굴 단계는 뺐다(2026-10-01 대표님 지시: "유튜브 자동발굴은 그만,
# 틱톡만 자동화"). 유튜브 신규 후보는 대표님이 채널 링크를 직접 찾아서 주시면
# 김이사가 조사해서 큐(scripts/seller_outreach_queue.json)에 수동으로 추가한다.
# 틱톡 자동화는 보류 상태(공식 검색 API가 승인제라 즉시 불가, 품질도 낮게 나옴).
# scripts/seller_discover_daily.mjs는 필요시 수동 실행용으로 남겨둠(워크플로우에서는 제외).
#
# Secrets 필요: GMAIL_APP_PASSWORD(등록됨)

name: 라이브 셀러 DM 자동화

on:
  schedule:
    - cron: "20 0 * * *"   # 매일 00:20 UTC = 09:20 KST
  workflow_dispatch: {}

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm install nodemailer --no-save

      - name: 오늘의 DM 처리(최대 10명)
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node scripts/seller_outreach_daily.mjs

      - name: 큐·seen 상태 커밋(변경 있을 때만)
        run: |
          git config user.name "beautyground-outreach-bot"
          git config user.email "beautyground.official@gmail.com"
          git add scripts/seller_outreach_queue.json scripts/seller_outreach_seen_channels.json
          git diff --cached --quiet || git commit -m "chore(outreach): 라이브 셀러 DM 발굴·발송 기록 — $(date +%Y-%m-%d)"
          git push origin HEAD:${{ github.ref_name }}
