# iOS 빌드 → App Store Connect(TestFlight) 업로드 — 2026-09-28 앱 스토어 등록 준비
#
# 왜 GitHub Actions인가: 사무실에 Mac이 없다. GitHub가 빌려주는 macOS 러너에서 Xcode로 빌드한다.
# 서명은 Xcode "클라우드 서명"에 맡긴다(-allowProvisioningUpdates + App Store Connect API 키) —
# 인증서·프로비저닝 프로파일을 손으로 만들어 올릴 필요가 없다.
#
# 필요한 저장소 Secrets (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID      App Store Connect API 키 ID (예: ABC123DEF4)
#   ASC_ISSUER_ID   Issuer ID (UUID)
#   ASC_KEY_P8      AuthKey_<KEY_ID>.p8 파일 내용 전체(-----BEGIN PRIVATE KEY----- 부터)
#
# 실행: Actions 탭 > "iOS TestFlight" > Run workflow (또는 main 에 ios/** 변경 push).
# 빌드 번호(CFBundleVersion)는 GitHub run_number 를 쓴다 — 올릴 때마다 자동 증가.

name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "표시 버전 (예: 1.0)"
        required: false
        default: "1.0"
  # push 자동 트리거는 일부러 뺐다 — Secrets 가 없거나 빌드가 실패하면 main 배포 때마다 빨간불이 뜬다. 필요할 때 수동으로 돌린다.

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: macos-26   # App Store Connect 는 iOS 26 SDK(Xcode 26) 빌드만 받는다(2026-09-28 4회차 업로드 409로 확인)
    timeout-minutes: 60
    env:
      SCHEME: App
      WORKSPACE: ios/App/App.xcodeproj
      ARCHIVE_PATH: ${{ github.workspace }}/build/App.xcarchive
      EXPORT_PATH: ${{ github.workspace }}/build/export
      MARKETING_VERSION: ${{ github.event.inputs.marketing_version || '1.0' }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22   # Capacitor CLI 8 은 Node >=22 필수(첫 실행 실패 원인)
          cache: npm

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -showsdks | grep -i ios

      - name: Install & build web (dist → 앱 내장; 실제 화면은 server.url 이 띄운다)
        run: |
          npm ci
          npm run build

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Set version / build number
        run: |
          cd ios/App
          xcrun agvtool new-marketing-version "$MARKETING_VERSION"
          xcrun agvtool new-version -all "$BUILD_NUMBER"

      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -project "$WORKSPACE" -scheme "$SCHEME"

      # 서명 방식: 수동. 클라우드 서명(-allowProvisioningUpdates)은 아카이브 때 "개발용" 프로파일을 만들려다
      # 팀에 등록된 기기가 없어 실패했다(2026-09-28 실행 2·3회차). 그래서 ASC API로 만든 Apple Distribution 인증서(.p12)와
      # App Store 프로파일("Beautyground App Store")을 Secrets 에 넣고 직접 서명한다.
      #   IOS_DIST_P12_BASE64 / IOS_DIST_P12_PASSWORD / IOS_PROFILE_BASE64
      - name: Install signing certificate & profile
        env:
          P12_B64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PW: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -e
          KC=$RUNNER_TEMP/build.keychain-db
          KC_PW=$(uuidgen)
          echo "$P12_B64" | base64 --decode > $RUNNER_TEMP/dist.p12
          echo "$PROFILE_B64" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          # Apple WWDR 중간 인증서(G3) — 배포 인증서 체인 검증용
          curl -sSL -o $RUNNER_TEMP/wwdrg3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import $RUNNER_TEMP/wwdrg3.cer -k "$KC" -T /usr/bin/codesign -T /usr/bin/security || true
          security import $RUNNER_TEMP/dist.p12 -P "$P12_PW" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
          security list-keychain -d user -s "$KC" login.keychain-db
          security find-identity -v -p codesigning "$KC"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$(security cms -D -i $RUNNER_TEMP/profile.mobileprovision)")
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "installed profile $UUID"

      - name: Archive (manual signing)
        run: |
          mkdir -p build
          xcodebuild archive \
            -project "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=7BL64YP4B2 \
            PROVISIONING_PROFILE_SPECIFIER="Beautyground App Store" \
            | tee build/archive.log | grep -E "error|warning: .*sign|Archive Succeeded|BUILD" || true
          test -d "$ARCHIVE_PATH" || { echo "::error::archive failed"; tail -100 build/archive.log; exit 1; }

      # 업로드는 Xcode 에 맡긴다(destination=upload + API 키). altool 은 5회차(2026-09-28)에서 30분 넘게 멈춰 폐기.
      - name: Export & upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>7BL64YP4B2</string>
            <key>provisioningProfiles</key><dict>
              <key>kr.co.beautyground.app</key><string>Beautyground App Store</string>
            </dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee build/export.log | tail -40
          grep -qE "EXPORT SUCCEEDED|Upload succeeded|exportArchive: Upload" build/export.log || { echo "::warning::export log 확인 필요"; }
          ls -la "$EXPORT_PATH" || true

      - name: Keep IPA as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ github.run_number }}
          path: |
            build/export/*
            build/archive.log
            build/export.log
          if-no-files-found: ignore
          retention-days: 14
